name: Deploy action
description: 'set node version and node sha before committing changes and deploy version'

inputs:
  PAT:
    description: 'PAT from repo (fallback if APP_ID/APP_PRIVATE_KEY are not set)'
    required: false
    default: ''
  APP_ID:
    description: 'GitHub App ID with Contents write on entrecode/ec.argocd (e.g. vars.GITOPS_APP_ID)'
    required: false
    default: ''
  APP_PRIVATE_KEY:
    description: 'Private key of that GitHub App (e.g. secrets.GITOPS_APP_PRIVATE_KEY)'
    required: false
    default: ''
  NAMESPACE:
    description: 'Namespace'
    required: true
    default: ''
  NAME:
    description: 'Name'
    required: false
    default: ''
  SERVICES:
    description: 'Services'
    required: false
    default: ''
  version:
    description: 'build.outputs.version'
    required: true
    default: ''
  env:
    description: 'build.outputs.env'
    required: true
    default: 'stage'
  SLACK_TOKEN:
    description: 'slack token'
    required: false
    default: ''
  SLACK_CHANNEL:
    description: 'slack channel'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
  - name: Check credentials
    if: (inputs.APP_ID == '' || inputs.APP_PRIVATE_KEY == '') && inputs.PAT == ''
    run: |
      echo "::error::Either APP_ID and APP_PRIVATE_KEY or PAT must be set"
      exit 1
    shell: bash

  - name: Create GitHub App token
    id: app-token
    if: inputs.APP_ID != '' && inputs.APP_PRIVATE_KEY != ''
    uses: actions/create-github-app-token@v2
    with:
      app-id: ${{ inputs.APP_ID }}
      private-key: ${{ inputs.APP_PRIVATE_KEY }}
      owner: entrecode
      repositories: ec.argocd

  - name: Get GitHub App bot user
    id: app-user
    if: steps.app-token.outputs.token != ''
    run: echo "id=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)" >> "$GITHUB_OUTPUT"
    shell: bash
    env:
      GH_TOKEN: ${{ steps.app-token.outputs.token }}
      APP_SLUG: ${{ steps.app-token.outputs.app-slug }}

  - uses: actions/checkout@v6
    with:
      repository: entrecode/ec.argocd
      token: ${{ steps.app-token.outputs.token || inputs.PAT }}
      ref: main

  - name: run yq eval node
    run: |
      if [[ -n ${SERVICES} ]]; then
        IFS="," read -r -a SRV <<< "${SERVICES}"
        for I in "${SRV[@]}"; do
          IFS=":" read -r SERVICE YQ_PATH <<< "${I}"
          YQ_PATH=${YQ_PATH:-.node}
          VERSION_FILE="apps/${{ inputs.env }}/${{ inputs.NAMESPACE }}/${SERVICE}/version.yaml"
          if [[ ! -f "${VERSION_FILE}" ]]; then
            echo "::warning::Skipping ${SERVICE}: ${VERSION_FILE} does not exist yet"
            continue
          fi
          VERSION=${YQ_PATH}.version GITSHA=${YQ_PATH}.gitsha yq eval -i 'eval(strenv(VERSION)) = "${{ inputs.version }}" | eval(strenv(GITSHA)) = "${{ github.sha }}"' "${VERSION_FILE}"
        done
      fi
      if [[ -n ${NAME} ]]; then
        VERSION_FILE="apps/${{ inputs.env }}/${{ inputs.NAMESPACE }}/${{ inputs.NAME }}/version.yaml"
        if [[ ! -f "${VERSION_FILE}" ]]; then
          echo "::warning::Skipping ${{ inputs.NAME }}: ${VERSION_FILE} does not exist yet"
        else
          yq eval -i '.node.version = "${{ inputs.version }}" | .node.gitsha = "${{ github.sha }}"' "${VERSION_FILE}"
        fi
      fi
    shell: bash
    env:
      SERVICES: ${{ inputs.SERVICES }}
      NAME: ${{ inputs.NAME }}

  - name: Commit changes
    run: |
      if [[ -n ${APP_SLUG} ]]; then
        git config --global user.name "${APP_SLUG}[bot]"
        git config --global user.email "${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
      else
        export GITHUB_EVENT_PUSHER_NAME=${{ github.event.pusher.name }}
        export GITHUB_EVENT_PUSHER_EMAIL=${{ github.event.pusher.email }}
        git config --global user.name "${GITHUB_EVENT_PUSHER_NAME:-${GITHUB_ACTOR:-github-actions[bot]}}"
        git config --global user.email "${GITHUB_EVENT_PUSHER_EMAIL:-41898282+github-actions[bot]}@users.noreply.github.com}"
      fi

      if [[ -n ${NAME} ]]; then
        MESSAGE+="[${{ inputs.env }}/${{ inputs.NAMESPACE }}/${NAME}] Deploy ${{ inputs.version }}"
        MESSAGE+=$'\n'
      fi
      if [[ -n ${SERVICES} ]]; then
        IFS="," read -r -a SRV <<< "${SERVICES}"
        for I in "${SRV[@]}"; do
          IFS=":" read -r SERVICE YQ_PATH <<< "${I}"
          MESSAGE+="[${{ inputs.env }}/${{ inputs.NAMESPACE }}/${SERVICE}] Deploy ${{ inputs.version }}"
          MESSAGE+=$'\n'
        done
      fi
      if [[ -n ${APP_SLUG} ]]; then
        MESSAGE+=$'\n'"Triggered-by: ${GITHUB_ACTOR} (${GITHUB_REPOSITORY}@${GITHUB_SHA})"
      fi

      if ! git diff --quiet; then
        git commit -am "${MESSAGE}"
      else
        echo "No changes – Commit is skipped."
        exit 0
      fi
      git pull --rebase
      git push
    shell: bash
    env:
      SERVICES: ${{ inputs.SERVICES }}
      NAME: ${{ inputs.NAME }}
      APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
      APP_USER_ID: ${{ steps.app-user.outputs.id }}


  - name: Hector slack Notifications with name as input
    if: inputs.NAMESPACE == 'hector' && inputs.env == 'prod' && inputs.SLACK_TOKEN != '' && inputs.SLACK_CHANNEL != '' && inputs.NAME != '' && inputs.SERVICES == ''
    uses: slackapi/slack-github-action@v3
    with:
      method: chat.postMessage
      token: ${{ inputs.SLACK_TOKEN }}
      payload: |
        channel: ${{ inputs.SLACK_CHANNEL }}
        attachments:
          - color: "28a745"
            fields:
              - value: "Neue Version ${{ inputs.version }} von ${{ inputs.NAME }} ausgerollt"

  - name: Set Service Name
    if: inputs.NAME == '' && inputs.SERVICES != ''
    run: |
      if [[ -n ${SERVICES} ]]; then
        IFS="," read -r -a SRV <<< "${SERVICES}"
        echo "SERVICE_NAME=${SRV[0]}" >> $GITHUB_ENV
      fi
    shell: bash
    env:
      SERVICES: ${{ inputs.SERVICES }}

  - name: Hector slack Notifications with services as input
    if: inputs.NAMESPACE == 'hector' && inputs.env == 'prod' && inputs.SLACK_TOKEN != '' && inputs.SLACK_CHANNEL != '' && inputs.NAME == '' && inputs.SERVICES != ''
    uses: slackapi/slack-github-action@v3
    with:
      method: chat.postMessage
      token: ${{ inputs.SLACK_TOKEN }}
      payload: |
        channel: ${{ inputs.SLACK_CHANNEL }}
        attachments:
          - color: "28a745"
            fields:
              - value: "Neue Version ${{ inputs.version }} von ${{ env.SERVICE_NAME }} ausgerollt"
